{% extends "base.html" %}{% block content %}<h1>Gestão de turmas</h1><div class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button>Criar turma</button></form></div><div class="card"><table><tr><th>Turma</th><th>Curso/Classe</th><th>Ano lectivo</th></tr>{% for x in items %}<tr><td>{{ x.name }}</td><td>{{ x.course }}</td><td>{{ x.academic_year }}</td></tr>{% empty %}<tr><td colspan="3">Sem turmas.</td></tr>{% endfor %}</table></div>{% endblock %}
