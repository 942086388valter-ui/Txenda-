{% extends "base.html" %}{% block content %}<h1>Gestão de disciplinas</h1><div class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button>Criar disciplina</button></form></div><div class="card"><table><tr><th>Código</th><th>Disciplina</th><th>Turma</th><th>Professor</th></tr>{% for x in items %}<tr><td>{{ x.code }}</td><td>{{ x.name }}</td><td>{{ x.class_group.name }}</td><td>{{ x.teacher|default:"—" }}</td></tr>{% empty %}<tr><td colspan="4">Sem disciplinas.</td></tr>{% endfor %}</table></div>{% endblock %}
